name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Phase 18C — Item 25: a fast "checks" job that runs on every push + PR.
  # Mirrors `scripts/precommit.sh` so contributors see the same gate locally.
  # Always blocks the bundle matrix below.
  # ---------------------------------------------------------------------------
  checks:
    name: Lint + Typecheck + Tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: ESLint
        run: npm run lint

      - name: Vitest
        run: npm run test

      - name: Frontend build
        run: npm run build

      - name: Rust format check
        working-directory: src-tauri
        run: cargo fmt -- --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Rust tests
        working-directory: src-tauri
        env:
          # Full backtrace so a panic we can't repro locally (a non-zero
          # exit from the lib target without any visible `test ... FAILED`
          # line) finally shows where it came from.
          RUST_BACKTRACE: full
          # Cargo's per-process log target is normally /dev/null; cranking
          # it to `debug` here is harmless and surfaces signal-kill details
          # if the test binary is taken down by the OS.
          CARGO_TERM_VERBOSE: "true"
        # `--nocapture` flushes stdout/stderr live (so a panic on shutdown
        # doesn't get swallowed by libtest's per-thread buffer). Without it
        # truncated logs hide the actual failure site.
        run: cargo test --no-fail-fast -- --nocapture

  bundle:
    name: Bundle · ${{ matrix.label }}
    needs: checks
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS (Apple Silicon · arm64)
            platform: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - label: macOS (Intel · x64)
            platform: macos-latest
            target: x86_64-apple-darwin
            bundles: app,dmg
          - label: Windows (x64)
            platform: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: msi,nsis
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.95.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Install sentry-cli
        if: env.SENTRY_AUTH_TOKEN != '' && startsWith(github.ref, 'refs/tags/v')
        run: npm install -g @sentry/cli
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

      # macOS code signing + notarization. Writes the App Store Connect API
      # key (.p8) to disk and exports APPLE_API_KEY_PATH so the build step
      # below can notarize. No-op on Windows and when the secret is absent
      # (forks / PRs build unsigned, no behaviour change).
      - name: Prepare Apple API key (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY" ]; then
            mkdir -p "$HOME/private_keys"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8"
            chmod 600 "$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8"
            echo "APPLE_API_KEY_PATH=$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8" >> "$GITHUB_ENV"
          else
            echo "↪ Apple API key secrets not set — building unsigned."
          fi

      - name: Build Tauri bundle
        run: npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}
        env:
          # When the repo has Sentry secrets configured the DSN gets baked
          # into the bundle (via vite.config.ts → import.meta.env). Without
          # secrets the var stays empty and Sentry init silently no-ops at
          # runtime — opt-in stays off, no behaviour change for end users.
          TRACKER_SENTRY_DSN_FRONTEND: ${{ secrets.TRACKER_SENTRY_DSN_FRONTEND }}
          # vite.config.ts treats VITE_RELEASE as "this is the release
          # build → emit hidden sourcemaps for upload". Empty = no sourcemaps.
          VITE_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.SENTRY_AUTH_TOKEN != '' && format('tracker@{0}', github.ref_name) || '' }}
          # Apple signing + notarization. Tauri imports the .p12 into an
          # ephemeral keychain (APPLE_CERTIFICATE + …_PASSWORD), signs with
          # hardened runtime, and notarizes + staples the .app when the
          # App Store Connect API key vars are present. All empty on Windows
          # and on forks/PRs → unsigned build, no failure.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          # APPLE_API_KEY_PATH is exported into $GITHUB_ENV by the step above.
          # Updater signing. `createUpdaterArtifacts: true` in tauri.conf.json
          # makes `tauri build` emit the updater bundle (.app.tar.gz / installer)
          # + a `.sig` per artifact, signed with this Ed25519 key. The matching
          # public key lives in tauri.conf.json → plugins.updater.pubkey. If the
          # secret is missing on a tag build the build fails on purpose — a
          # release without a valid signature can't self-update.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      # Tauri notarizes + staples the .app, but NOT the .dmg container. A
      # downloaded un-notarized DMG still triggers a Gatekeeper warning on
      # double-click, so notarize + staple the DMG itself. macOS only; skips
      # cleanly when the API key secrets are absent.
      - name: Notarize & staple DMG (macOS)
        if: runner.os == 'macOS'
        env:
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          KEY_PATH="$HOME/private_keys/AuthKey_${APPLE_API_KEY}.p8"
          if [ -z "$APPLE_API_ISSUER" ] || [ ! -f "$KEY_PATH" ]; then
            echo "↪ Apple notarization secrets not set — skipping DMG notarization."
            exit 0
          fi
          shopt -s nullglob
          for dmg in src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg; do
            echo "Notarizing $dmg"
            xcrun notarytool submit "$dmg" --wait \
              --key-id "$APPLE_API_KEY" \
              --key "$KEY_PATH" \
              --issuer "$APPLE_API_ISSUER"
            xcrun stapler staple "$dmg"
            xcrun stapler validate "$dmg"
          done

      # Sentry sourcemap + Rust debug-files upload. Skipped (equivalent to
      # SKIP_SENTRY=1) when any of the required secrets is missing — that
      # way a fork or a private clone without Sentry credentials still
      # builds happily.
      - name: Sentry — upload sourcemaps + debug-files
        if: env.SENTRY_AUTH_TOKEN != '' && startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT_FRONTEND: ${{ secrets.SENTRY_PROJECT_FRONTEND }}
          SENTRY_PROJECT_BACKEND: ${{ secrets.SENTRY_PROJECT_BACKEND }}
          RELEASE: tracker@${{ github.ref_name }}
        run: |
          set -eu
          if [ -z "${SENTRY_ORG:-}" ] || [ -z "${SENTRY_PROJECT_FRONTEND:-}" ] || [ -z "${SENTRY_PROJECT_BACKEND:-}" ]; then
            echo "↪ Sentry org/project secrets not all set — skipping upload."
            exit 0
          fi
          sentry-cli releases new "$RELEASE" \
            --project "$SENTRY_PROJECT_FRONTEND" \
            --project "$SENTRY_PROJECT_BACKEND" || true
          sentry-cli sourcemaps upload \
            --project "$SENTRY_PROJECT_FRONTEND" \
            --release "$RELEASE" \
            ./dist || true
          sentry-cli debug-files upload \
            --project "$SENTRY_PROJECT_BACKEND" \
            --include-sources \
            "./src-tauri/target/${{ matrix.target }}/release" || true
          sentry-cli releases set-commits "$RELEASE" --auto || true
          sentry-cli releases finalize "$RELEASE" \
            --project "$SENTRY_PROJECT_FRONTEND" \
            --project "$SENTRY_PROJECT_BACKEND" || true

      - name: Upload artifacts (macOS)
        if: contains(matrix.platform, 'macos')
        uses: actions/upload-artifact@v4
        with:
          name: Tracker-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz.sig

      - name: Upload artifacts (Windows)
        if: contains(matrix.platform, 'windows')
        uses: actions/upload-artifact@v4
        with:
          name: Tracker-${{ matrix.target }}
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi.sig
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe.sig

  release:
    name: Release
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Assemble the Tauri updater feed from the signed artifacts. Emits
      # updater-dist/latest.json + arch-renamed macOS .app.tar.gz(.sig) so the
      # `releases/latest/download/latest.json` endpoint serves valid, signed
      # update metadata. Windows installers are referenced in place.
      - name: Build updater latest.json
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: node scripts/build-latest-json.mjs "${{ github.ref_name }}" artifacts updater-dist

      # Tag of the form `v1.2.3-rc.1` (anything with a dash after the
      # version) is treated as a pre-release. Plain `v1.2.3` ships as a
      # full release.
      - name: Detect prerelease from tag
        id: prerelease
        run: |
          if [[ "${{ github.ref_name }}" == *-* ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ steps.prerelease.outputs.is_prerelease }}
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.msi
            artifacts/**/*.exe
            updater-dist/*.app.tar.gz
            updater-dist/*.app.tar.gz.sig
            updater-dist/latest.json
