[package]
name = "tracker"
version = "1.0.2"
description = "Local-first time tracker for Jira Cloud"
authors = ["Tracker contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
# Tauri core (keep, add features)
tauri = { version = "2.11", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2.4"
tauri-plugin-deep-link = "2.4"
tauri-plugin-autostart = "2"
tauri-plugin-notification = "2"

# Storage
rusqlite = { version = "0.31", features = ["bundled", "chrono"] }
r2d2 = "0.8"
r2d2_sqlite = "0.24"

# HTTP / Jira API
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }
url = "2.5"

# Local HTTP server
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }
hyper = "1"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization (keep existing)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Time
chrono = { version = "0.4", features = ["serde"] }

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Errors
thiserror = "1"
anyhow = "1"

# Image processing (used by tray_pulse to alpha-modulate the recording dot at runtime)
image = { version = "0.25", default-features = false, features = ["png"] }

# SVG → PNG rendering pro idle tray icon (white "Zzz" silueta).
resvg = { version = "0.44", default-features = false }
usvg = { version = "0.44", default-features = false }
tiny-skia = "0.11"

# Phase 19: opt-in Sentry crash + error reporting. `rustls` mirrors the rest
# of the project's TLS stack (see `reqwest` above). `default-features = false`
# disables `release-health` / `debug-images` / `transport=native-tls` so we
# only ship what we actually use.
sentry = { version = "0.48", default-features = false, features = ["backtrace", "panic", "contexts", "reqwest", "rustls"] }

# Phase 19: stable anonymous install id (UUID v4). `v4` enables a random
# generator; `serde` lets us round-trip through `app_settings` JSON if
# anyone ever wants to.
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
# Dock-icon swap potřebuje NSApplication.setApplicationIconImage.
# Verze sjednocená s Tauri 2.11 transitive deps (Cargo.lock).
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
    "NSApplication",
    "NSImage",
    "NSEvent",
    "NSResponder",
] }
objc2-foundation = { version = "0.3", features = ["NSData"] }
# Pro popover global mouse monitor — RcBlock pro NSEvent handler block.
block2 = "0.6"

[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
tokio = { version = "1", features = ["test-util", "macros"] }
tauri = { version = "2.11", features = ["tray-icon", "image-png", "test"] }
