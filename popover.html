<!doctype html>
<html lang="en" data-window="popover">
  <head>
    <meta charset="UTF-8" />
    <title>Tracker — Popover</title>
    <style>
      /* The popover window is `transparent: true` + `decorations: false`.
         Make the document layer fully transparent so the inner card (which
         carries its own opaque background + 12px corners + shadow) appears
         to float as a native macOS menu / tooltip. No outer padding here —
         the card fills the window edge-to-edge. */
      html, body, #root {
        background: transparent !important;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/popover.tsx"></script>
  </body>
</html>
